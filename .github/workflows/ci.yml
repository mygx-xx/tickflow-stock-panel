name: CI

# 持续集成: 后端全量测试 + 前端构建。
# 与 release.yml 的分工: 这里不打包, 只守质量门 —
# 后端含 Tier A 开放契约快照测试 (test_openapi_contract.py),
# 开放面的任何变化都会在这里被拦下, 须有意识地更新快照。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装依赖 (含 dev 测试链)
        run: uv sync --extra dev --frozen

      - name: 后端全量测试
        run: uv run pytest tests -q -rf

      # 把失败详情推到 GitHub 页面: 否则 Actions 页只有一行
      # "process exited with code 1", 还得有 admin 权限下载 200MB 日志才能定位
      # (logs 端点对非 admin 返回 403) —— 这正是本 workflow 连续失败 10 次
      # 却难以定位的原因。两条通道互补:
      #   1) ::error:: 注解 → Checks/PR 页面的 inline 注释, 任何人可见;
      #   2) $GITHUB_STEP_SUMMARY → run 页面的 Summary 区块。
      - name: 上报失败详情
        if: failure()
        run: |
          set +e
          uv run pytest tests -q -rf --tb=short > /tmp/pytest-out.txt 2>&1
          tail -100 /tmp/pytest-out.txt > /tmp/pytest-tail.txt
          {
            echo "### pytest 失败摘要"
            echo '```'
            cat /tmp/pytest-tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 逐行打成 error 注解(GitHub 单条上限 1KB, 故按行切分并限制条数)
          echo "::group::pytest 失败输出"
          sed -n 's/^/::error title=pytest::/p' /tmp/pytest-tail.txt | head -40
          echo "::endgroup::"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 (tsc + vite)
        run: pnpm build
